topics:
  "/pedal_status":
    msg_type: "sensor_msgs.msg.Joy"
    description: "Pedal input device"

  "/cam_right_wrist/color/image_rect_raw":
    msg_type: "sensor_msgs.msg.Image"
    description: "Right wrist camera"

  "/cam_left_wrist/color/image_rect_raw":
    msg_type: "sensor_msgs.msg.Image"
    description: "Left wrist camera"

  "/cam_front/color/image_rect_raw":
    msg_type: "sensor_msgs.msg.Image"
    description: "Front camera between arms"

  "/cam_high/color/image_rect_raw":
    msg_type: "sensor_msgs.msg.Image"
    description: "high camera"

  "/cam_l515/color/image_raw":
    msg_type: "sensor_msgs.msg.Image"
    description: "Top-mounted L515 camera"

  "/cam_l515/depth/image_rect_raw":
    msg_type: "sensor_msgs.msg.Image"
    description: "Top-mounted L515 depth image"

  "/cam_d457/color/image_raw":
    msg_type: "sensor_msgs.msg.Image"
    description: "Top-mounted D457 camera"

  "/cam_d457/depth/color/points":
    msg_type: "sensor_msgs.msg.PointCloud2"
    description: "Top-mounted D457 pointcloud"

  "/arm_l_status":
    msg_type: "yam_arm_msg.msg.YamStatus"
    description: "Left arm status"

  "/arm_r_status":
    msg_type: "yam_arm_msg.msg.YamStatus"
    description: "Right arm status"

  "/odom":
    msg_type: "nav_msgs.msg.Odometry"
    description: "Base odometry"

  "/cmd_vel":
    msg_type: "geometry_msgs.msg.TwistStamped"
    description: "Base velocity commands"
