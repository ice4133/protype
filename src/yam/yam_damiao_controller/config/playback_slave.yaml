# Playback configuration — slave arms receive joint commands from /YAM_VR_L,R
# Used with hdf5_playback_pub + intervention_relay_node

/slave_l:
  ros__parameters:
    arm_can_id: can_slave_l
    arm_control_type: normal
    arm_pub_topic_name: slave_l_status
    arm_sub_topic_name: YAM_VR_L
    arm_control_period: 0.004
    arm_kp_1_3: 120.0
    arm_kp_4_6: 30.0
    arm_kd_1_3: 2.0
    arm_kd_4_6: 1.0
    gripper_position_gain: 20.0
    gripper_velocity_gain: 1.0
    gripper_torque_limit: 3.0
    go_home_kp: 25.0
    go_home_kd: 0.5

/slave_r:
  ros__parameters:
    arm_can_id: can_slave_r
    arm_control_type: normal
    arm_pub_topic_name: slave_r_status
    arm_sub_topic_name: YAM_VR_R
    arm_control_period: 0.004
    arm_kp_1_3: 120.0
    arm_kp_4_6: 30.0
    arm_kd_1_3: 2.0
    arm_kd_4_6: 1.0
    gripper_position_gain: 20.0
    gripper_velocity_gain: 1.0
    gripper_torque_limit: 3.0
    go_home_kp: 25.0
    go_home_kd: 0.5
